[project]
name = "rfp-agents"
version = "0.2.0"
description = "RFP 작성 에이전트와 RFP 대응 Workday 제안서(PPTX) 작성 에이전트"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.8.0",
    "python-pptx>=1.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rfp-agent = "rfp_agent.cli:main"
proposal-agent = "proposal_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent_core", "rfp_agent", "proposal_agent"]
