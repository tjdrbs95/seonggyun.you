[project]
name = "rfp-agent"
version = "0.1.0"
description = "대화형으로 요구사항을 수집해 제안요청서(RFP)를 작성하는 Claude 에이전트"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.8.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rfp-agent = "rfp_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rfp_agent"]
